cruise_speed_mps: {value: 4.0, unit: mps, provenance: SIMULATION_ONLY}
acceleration_limit_mps2: {value: 2.0, unit: mps2, provenance: SIMULATION_ONLY}
rotors:
  - &rotor_fr
    rotor_id: front_right
    position_body_frd: {value: [0.13, 0.22, -0.023], unit: m_BODY_FRD, provenance: REFERENCE_PRESET}
    thrust_axis_body_frd: {value: [0.0, 0.0, -1.0], unit: unit_vector_BODY_FRD, provenance: REFERENCE_PRESET}
    rotation_direction: CCW
    diameter: {value: 0.254, unit: m, provenance: REFERENCE_PRESET}
