body_height_m: {value: 0.14, unit: m, provenance: REFERENCE_PRESET}
arm_length_m: {value: 0.255, unit: m, provenance: REFERENCE_PRESET}
center_of_mass: {value: [0.0, 0.0, 0.02], unit: m_BODY_FRD, provenance: ENGINEERING_ESTIMATE}
inertia:
  ixx: {value: 0.008, unit: kg_m2, provenance: REFERENCE_PRESET}
  iyy: {value: 0.015, unit: kg_m2, provenance: REFERENCE_PRESET}
  izz: {value: 0.017, unit: kg_m2, provenance: REFERENCE_PRESET}
  ixy: {value: 0.0, unit: kg_m2, provenance: ENGINEERING_ESTIMATE}
  ixz: {value: 0.0, unit: kg_m2, provenance: ENGINEERING_ESTIMATE}
  iyz: {value: 0.0, unit: kg_m2, provenance: ENGINEERING_ESTIMATE}
drag_parameters:
