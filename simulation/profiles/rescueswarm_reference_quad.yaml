schema_version: "1.0"
profile_id: rescueswarm_reference_quad
vehicle_name: RescueSwarm Reference QUAD_X (not measured hardware)
frame_type: MULTIROTOR
rotor_count: 4
rotor_layout: QUAD_X
# Simulation-only reference dynamics are intentionally aligned with the
# official ardupilot_gazebo Iris reference, not asserted as RescueSwarm mass.
mass_kg: {value: 1.5, unit: kg, provenance: REFERENCE_PRESET}
body_length_m: {value: 0.32, unit: m, provenance: REFERENCE_PRESET}
