      moment_constant: {value: 0.016, unit: m, provenance: REFERENCE_PRESET}
      max_rotor_velocity: {value: 838.0, unit: radps, provenance: REFERENCE_PRESET}
    motor_time_constant: {value: 0.02, unit: s, provenance: REFERENCE_PRESET}
  - <<: *rotor_fr
    rotor_id: rear_left
    position_body_frd: {value: [-0.13, -0.20, -0.023], unit: m_BODY_FRD, provenance: REFERENCE_PRESET}
  - <<: *rotor_fr
    rotor_id: front_left
    position_body_frd: {value: [0.13, -0.22, -0.023], unit: m_BODY_FRD, provenance: REFERENCE_PRESET}
    rotation_direction: CW
  - <<: *rotor_fr
    rotor_id: rear_right
    position_body_frd: {value: [-0.13, 0.20, -0.023], unit: m_BODY_FRD, provenance: REFERENCE_PRESET}
